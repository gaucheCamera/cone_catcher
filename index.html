<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#263f34">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Cone Catcher</title>
  <style>
    :root{
      --bg:#17241f;--panel:#24362e;--text:#f1eadc;--muted:#c8c1b2;
      --line:#597064;--accent:#d7b354;--button:#385546
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;min-height:100%;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overscroll-behavior:none
    }
    body{
      padding:max(10px,env(safe-area-inset-top))
              max(10px,env(safe-area-inset-right))
              max(10px,env(safe-area-inset-bottom))
              max(10px,env(safe-area-inset-left))
    }
    .app{width:min(100%,960px);margin:0 auto}
    h1{font-size:clamp(20px,5vw,30px);margin:0 0 8px;text-align:center;letter-spacing:.03em}
    details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
    summary{cursor:pointer;font-weight:700;user-select:none}
    .settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:12px}
    fieldset{border:0;padding:0;margin:0;min-width:0}
    .settings legend{font-weight:700;font-size:14px;margin-bottom:6px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    label{font-size:12px;color:var(--muted)}
    input[type=number]{
      display:block;width:100%;min-height:42px;margin-top:3px;border:1px solid var(--line);
      border-radius:9px;background:#182720;color:var(--text);padding:7px 8px;font-size:16px
    }
    .check{display:flex;align-items:center;gap:7px;min-height:42px}
    .check input{width:19px;height:19px}
    .summary{font-size:11px;color:var(--muted);margin:10px 0 0}
    .characters{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
    .characters span{font-size:13px;font-weight:700}
    button{
      appearance:none;border:1px solid var(--line);background:var(--button);color:var(--text);
      border-radius:10px;min-height:44px;padding:8px 13px;font:600 14px system-ui;
      touch-action:manipulation
    }
    .characters button.selected{background:var(--accent);color:#2d281d;border-color:#f0d883}
    .characters button:disabled,input:disabled{opacity:.55}
    .hud{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;font-size:13px;margin:7px 2px}
    .hud strong{color:white}.status{margin-left:auto;color:var(--muted)}
    .gamebox{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:#25382f;box-shadow:0 7px 30px rgba(0,0,0,.22)}
    canvas{display:block;width:100%;height:520px;touch-action:none}
    .controls{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;margin-top:9px}
    .controls button{min-height:52px;font-size:16px}
    .start{background:var(--accent);color:#2c291f;border-color:#ead47b;padding-inline:22px}
    .subcontrols{display:flex;justify-content:center;gap:8px;margin-top:7px}
    .tip{text-align:center;color:var(--muted);font-size:11px;margin-top:7px}
    @media(max-width:720px){
      body{padding-left:6px;padding-right:6px}
      canvas{height:560px}
      .settings{grid-template-columns:1fr 1fr}
      .hud{gap:5px 10px}.status{width:100%;margin-left:0}
      .gamebox{border-radius:10px}
      .characters{justify-content:center}.characters span{width:100%;text-align:center}
      .tip{font-size:10px}
    }
    @media(max-width:470px){
      .settings{grid-template-columns:1fr}
      .fields{grid-template-columns:1fr 1fr}
      details{padding:9px}.controls button{padding:7px 6px}h1{margin-bottom:5px}
    }
  </style>
</head>
<body>
<div class="app">
  <h1>CONE CATCHER</h1>

  <details>
    <summary>Game tuning settings</summary>
    <div class="settings">
      <fieldset><legend>Hawk</legend><div class="fields">
        <label>Initial buffer (s)<input id="hawk-buffer" type="number" min="0" max="300" step="5" value="45"></label>
        <label>Check interval (s)<input id="hawk-interval" type="number" min="1" max="120" step="1" value="10"></label>
        <label>Chance/check (%)<input id="hawk-prob" type="number" min="0" max="100" step="5" value="25"></label>
        <label class="check"><input id="protect-last" type="checkbox" checked>Protect last squirrel</label>
      </div></fieldset>

      <fieldset><legend>Squirrel throws</legend><div class="fields">
        <label>Fastest base (s)<input id="throw-min" type="number" min="0.3" max="10" step="0.05" value="1.55"></label>
        <label>Slowest base (s)<input id="throw-max" type="number" min="0.3" max="12" step="0.05" value="3.20"></label>
        <label>Difficulty ramp (s)<input id="ramp-time" type="number" min="10" max="600" step="10" value="140"></label>
        <label>Late-game rate (%)<input id="ramp-floor" type="number" min="10" max="100" step="5" value="43"></label>
      </div></fieldset>

      <fieldset><legend>Thrown objects</legend><div class="fields">
        <label>Baby hare (%)<input id="hare" type="number" min="0" max="50" step="0.5" value="3.5"></label>
        <label>Green cones (%)<input id="green" type="number" min="0" max="100" step="1" value="46"></label>
        <label>Green gravity<input id="green-g" type="number" min="100" max="800" step="10" value="340"></label>
        <label>Brown gravity<input id="brown-g" type="number" min="80" max="600" step="10" value="215"></label>
      </div></fieldset>

      <fieldset><legend>Tree recruitment</legend><div class="fields">
        <label>Brown germination (%)<input id="germ" type="number" min="0" max="100" step="1" value="46"></label>
        <label>Cache min (s)<input id="cache-min" type="number" min="0" max="30" step="0.5" value="2.5"></label>
        <label>Cache max (s)<input id="cache-max" type="number" min="0" max="30" step="0.5" value="5.5"></label>
        <label>Sapling min (s)<input id="sap-min" type="number" min="1" max="30" step="0.5" value="4.5"></label>
        <label>Sapling max (s)<input id="sap-max" type="number" min="1" max="30" step="0.5" value="6.3"></label>
      </div></fieldset>

      <fieldset><legend>Player</legend><div class="fields">
        <label>Maximum bonks<input id="max-bonks" type="number" min="1" max="9" step="1" value="3"></label>
        <label>Bonk immunity (s)<input id="immunity" type="number" min="0" max="5" step="0.05" value="1.25"></label>
      </div></fieldset>

      <fieldset><legend>Scoring</legend><div class="fields">
        <label>Catch points<input id="catch-points" type="number" min="0" max="1000" step="25" value="125"></label>
        <label>Hare bonus<input id="hare-points" type="number" min="0" max="1000" step="25" value="75"></label>
        <label>Survival pts/s<input id="survival" type="number" min="0" max="100" step="1" value="12"></label>
      </div></fieldset>
    </div>
    <p class="summary" id="settings-summary">Settings lock when a run begins.</p>
  </details>

  <div class="characters">
    <span>Character</span>
    <button data-char="jack" class="selected">Jack</button>
    <button data-char="cristian">Cristian</button>
    <button data-char="susanna">Susanna</button>
    <button data-char="lucy">Lucy</button>
  </div>

  <div class="hud">
    <span>Player <strong id="player">Jack</strong></span>
    <span>Score <strong id="score">0</strong></span>
    <span>Caught <strong id="caught">0</strong></span>
    <span>Bonks <strong id="bonks">0</strong>/<strong id="bonk-max">3</strong></span>
    <span>Trees <strong id="trees">3</strong></span>
    <span>Squirrels <strong id="squirrels">2</strong></span>
    <span class="status" id="status">Ready</span>
  </div>

  <div class="gamebox"><canvas id="game" aria-label="Cone Catcher game"></canvas></div>

  <div class="controls">
    <button id="left" disabled>◀ LEFT</button>
    <button id="start" class="start">START</button>
    <button id="right" disabled>RIGHT ▶</button>
  </div>

  <div class="subcontrols">
    <button id="pause" disabled>Pause</button>
    <button id="restart">Restart</button>
  </div>

  <div class="tip">Phone: hold LEFT/RIGHT or drag directly on the game.</div>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s),canvas=$('#game'),ctx=canvas.getContext('2d');
const startBtn=$('#start'),leftBtn=$('#left'),rightBtn=$('#right'),pauseBtn=$('#pause'),restartBtn=$('#restart');
const scoreEl=$('#score'),caughtEl=$('#caught'),bonksEl=$('#bonks'),bonkMaxEl=$('#bonk-max'),
      treesEl=$('#trees'),squirrelsEl=$('#squirrels'),playerEl=$('#player'),statusEl=$('#status'),
      summaryEl=$('#settings-summary');
const charBtns=[...document.querySelectorAll('[data-char]')],settingInputs=[...document.querySelectorAll('details input')];
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let W=620,H=340,DPR=1,groundY=307,state='ready',elapsed=0,caught=0,bonks=0,bonus=0,finalScore=0,invuln=0;
let playerX=310,targetX=310,facing=1,moveDir=0,selected='jack',
    trees=[],squirrels=[],objects=[],caches=[],saplings=[],particles=[],hares=[],catchAnims=[],
    last=0,raf=0,nextHawkCheck=45;
let hawk={active:false,t:0,duration:1.55,target:null,carrying:null,grabbed:false,startX:0,startY:0,grabX:0,grabY:0,endX:0,endY:0,dir:1};
const cfg={};

const chars={
  jack:{name:'Jack',h:52,w:17,coat:'#f0c43d',skin:'#d5a06e',hair:'#8b713e',beard:'#8b713e',cap:'#315b55',beardOn:true,capOn:true,hairLong:false},
  cristian:{name:'Cristian',h:47,w:16,coat:'#79502e',skin:'#d2a072',hair:'#593822',beard:'#593822',beardOn:true,capOn:false,hairLong:false},
  susanna:{name:'Susanna',h:43,w:15,coat:'#8b8172',skin:'#d7a77c',hair:'#553524',beardOn:false,capOn:false,hairLong:true},
  lucy:{name:'Lucy',h:39,w:14,coat:'#d6cfbd',skin:'#e0b184',hair:'#d7ad52',beardOn:false,capOn:false,hairLong:true}
};

const C={
  sky1:'#719aa5',sky2:'#b9b27d',mountain:'#63765e',far:'#4e6650',near:'#394f41',
  ground:'#7d633e',soil:'#513a2a',bark:'#67432d',pine:'#25483a',pine2:'#355c48',
  brown:'#71472d',brown2:'#a06a42',green:'#587548',green2:'#88a25e',
  basket:'#98673a',basketLight:'#b8864d',basketDark:'#573b27',
  sprout:'#76945e',spark:'#e0bf59',hare:'#d8c5ab',hareDark:'#62564a',
  hawk:'#4b4035',hawkLight:'#8b735b',hawkDark:'#25211d'
};

const squirrelPalette=[
  {body:'#ad5131',dark:'#633122'},
  {body:'#c36a3d',dark:'#743d27'},
  {body:'#756b65',dark:'#423d38'},
  {body:'#5c4032',dark:'#32251f'},
  {body:'#252422',dark:'#111110'}
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),
      smooth=t=>t*t*(3-2*t),
      lerp=(a,b,t)=>a+(b-a)*t,
      rand=(a,b)=>a+Math.random()*(b-a),
      treeTop=t=>groundY-t.h,
      scoreNow=()=>Math.floor(elapsed*cfg.survival)+bonus;

function num(id,min,max,fallback){
  const el=$(id),v=Number(el.value),x=clamp(Number.isFinite(v)?v:fallback,min,max);
  el.value=String(x); return x;
}

function readSettings(){
  cfg.hawkBuffer=num('#hawk-buffer',0,300,45);
  cfg.hawkInterval=num('#hawk-interval',1,120,10);
  cfg.hawkProb=num('#hawk-prob',0,100,25)/100;
  cfg.protectLast=$('#protect-last').checked;

  cfg.throwMin=num('#throw-min',.3,10,1.55);
  cfg.throwMax=num('#throw-max',.3,12,3.2);
  if(cfg.throwMax<cfg.throwMin){cfg.throwMax=cfg.throwMin;$('#throw-max').value=cfg.throwMax}
  cfg.rampTime=num('#ramp-time',10,600,140);
  cfg.rampFloor=num('#ramp-floor',10,100,43)/100;

  cfg.hare=num('#hare',0,50,3.5)/100;
  cfg.green=num('#green',0,100,46)/100;
  cfg.greenG=num('#green-g',100,800,340);
  cfg.brownG=num('#brown-g',80,600,215);

  cfg.germ=num('#germ',0,100,46)/100;
  cfg.cacheMin=num('#cache-min',0,30,2.5);
  cfg.cacheMax=num('#cache-max',0,30,5.5);
  if(cfg.cacheMax<cfg.cacheMin)cfg.cacheMax=cfg.cacheMin;
  cfg.sapMin=num('#sap-min',1,30,4.5);
  cfg.sapMax=num('#sap-max',1,30,6.3);
  if(cfg.sapMax<cfg.sapMin)cfg.sapMax=cfg.sapMin;

  cfg.maxBonks=Math.round(num('#max-bonks',1,9,3));
  cfg.immunity=num('#immunity',0,5,1.25);
  cfg.catchPoints=Math.round(num('#catch-points',0,1000,125));
  cfg.harePoints=Math.round(num('#hare-points',0,1000,75));
  cfg.survival=num('#survival',0,100,12);

  bonkMaxEl.textContent=cfg.maxBonks;
  summaryEl.textContent=`Hawk: ${cfg.hawkBuffer}s buffer, ${Math.round(cfg.hawkProb*100)}% every ${cfg.hawkInterval}s · Throws: ${cfg.throwMin}–${cfg.throwMax}s · Hare ${(cfg.hare*100).toFixed(1)}% · Germination ${Math.round(cfg.germ*100)}%.`;
}
settingInputs.forEach(el=>el.addEventListener('input',()=>{if(state!=='playing'){readSettings();hud();draw(performance.now())}}));

function makeTree(x,h,depth=Math.random()){return{x,h,depth,sway:Math.random()*6.28}}
function makeSquirrel(treeIndex){
  const t=trees[treeIndex],min=treeTop(t)+26,max=groundY-88,y=rand(min,max);
  return{tree:treeIndex,y,targetY:rand(min,max),speed:rand(17,37),side:Math.random()<.5?-1:1,timer:rand(cfg.throwMin,cfg.throwMax),pause:0,color:squirrelPalette[Math.floor(Math.random()*squirrelPalette.length)]}
}
function sBounds(s){const t=trees[s.tree];return{min:treeTop(t)+26,max:groundY-88}}
function sPos(s){const t=trees[s.tree],f=(s.y-treeTop(t))/Math.max(1,t.h);return{x:t.x+s.side*(8+f*18),y:s.y}}
function randomSquirrels(n){
  const ids=trees.map((_,i)=>i);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  squirrels=[];for(let i=0;i<n;i++)squirrels.push(makeSquirrel(ids[i%ids.length]));
}

function reset(){
  readSettings();
  elapsed=0;caught=0;bonks=0;bonus=0;finalScore=0;invuln=0;
  nextHawkCheck=cfg.hawkBuffer;
  objects=[];caches=[];saplings=[];particles=[];hares=[];catchAnims=[];
  hawk.active=false;hawk.target=null;hawk.carrying=null;hawk.grabbed=false;
  playerX=W/2;targetX=playerX;facing=1;moveDir=0;
  trees=[
    makeTree(W*.13,H*.91,.78),
    makeTree(W*.49,H*.96,.34),
    makeTree(W*.84,H*.89,.58)
  ];
  randomSquirrels(2);
  hud('Catch them. Dodge them.');
}

function resize(){
  const r=canvas.parentElement.getBoundingClientRect();
  W=Math.max(300,Math.round(r.width));

  const phone = W < 720;
  const targetH = phone
    ? Math.max(W*1.30, window.innerHeight*.64)
    : Math.max(W*.82, window.innerHeight*.62);

  H=Math.round(clamp(targetH,460,700));
  canvas.style.height=H+'px';

  groundY=Math.round(H*.92);
  DPR=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);

  if(state==='ready'){
    trees=[
      makeTree(W*.13,H*.90,.78),
      makeTree(W*.49,H*.95,.34),
      makeTree(W*.84,H*.88,.58)
    ];
    randomSquirrels(2);
    playerX=W/2;
    targetX=playerX;
  }
  draw(performance.now());
}

function hud(msg){
  scoreEl.textContent=state==='over'?finalScore:scoreNow();
  caughtEl.textContent=caught;bonksEl.textContent=bonks;bonkMaxEl.textContent=cfg.maxBonks||3;
  treesEl.textContent=trees.length+saplings.length;squirrelsEl.textContent=squirrels.length;
  playerEl.textContent=chars[selected].name;if(msg)statusEl.textContent=msg;
}

function choose(id){
  if(state==='playing')return;
  selected=id;
  charBtns.forEach(b=>b.classList.toggle('selected',b.dataset.char===id));
  hud();draw(performance.now());
}
charBtns.forEach(b=>b.addEventListener('click',()=>choose(b.dataset.char)));

function lockSetup(v){settingInputs.forEach(el=>el.disabled=v);charBtns.forEach(b=>b.disabled=v)}
function start(){
  reset();state='playing';startBtn.disabled=true;leftBtn.disabled=false;rightBtn.disabled=false;
  pauseBtn.disabled=false;restartBtn.disabled=false;lockSetup(true);
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function pause(){
  if(state==='playing'){
    state='paused';pauseBtn.textContent='Resume';cancelAnimationFrame(raf);draw(performance.now());
  }else if(state==='paused'){
    state='playing';pauseBtn.textContent='Pause';last=performance.now();raf=requestAnimationFrame(loop);
  }
}
function end(){
  state='over';finalScore=scoreNow();startBtn.disabled=false;startBtn.textContent='Play again';
  leftBtn.disabled=true;rightBtn.disabled=true;pauseBtn.disabled=true;lockSetup(false);
  hud('Run over');draw(performance.now());
}

function toss(s){
  const p=sPos(s);
  let target=playerX+(Math.random()-.5)*(90+Math.min(120,elapsed*1.2));
  if(Math.random()>.64)target=rand(18,W-18);
  target=clamp(target,14,W-14);

  if(Math.random()<cfg.hare){
    const g=190,f=rand(1.45,2);
    objects.push({kind:'hare',x:p.x,y:p.y+3,vx:(target-p.x)/f,vy:(groundY-p.y-.5*g*f*f)/f,g,r:7,rot:0,spin:0});
    s.pause=.18;return;
  }

  const type=Math.random()<cfg.green?'green':'brown',
        g=type==='green'?cfg.greenG+Math.min(120,elapsed*.55):cfg.brownG+Math.min(80,elapsed*.35),
        f=type==='green'?rand(.95,1.7):rand(1.35,2.5);
  objects.push({kind:'cone',type,x:p.x,y:p.y+3,vx:(target-p.x)/f,vy:(groundY-p.y-.5*g*f*f)/f,g,r:5,rot:Math.random()*6.28,spin:rand(-4,4)});
  s.pause=.15;
}

function throwInterval(){
  const ramp=Math.max(cfg.rampFloor,1-(elapsed/cfg.rampTime)*(1-cfg.rampFloor));
  return rand(cfg.throwMin,cfg.throwMax)*ramp;
}

function updateSquirrel(s,dt){
  const b=sBounds(s);s.pause=Math.max(0,s.pause-dt);
  if(s.pause<=0){
    const dy=s.targetY-s.y;
    if(Math.abs(dy)<2.5){s.targetY=rand(b.min,b.max);if(Math.random()<.4)s.side*=-1}
    else s.y+=Math.sign(dy)*s.speed*dt;
  }
  s.y=clamp(s.y,b.min,b.max);s.timer-=dt;
  if(s.timer<=0){toss(s);s.timer=throwInterval()}
}

function burst(x,y,n,color){
  if(reduced)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*6.28,sp=rand(20,70);
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-12,age:0,life:rand(.35,.7),r:rand(1,2.8),color});
  }
}

function plantCone(c){
  const x=clamp(c.x,16,W-16);
  burst(x,groundY-2,7,C.soil);
  caches.push({x,age:0,settle:.35,resolveAt:rand(cfg.cacheMin,cfg.cacheMax),willSprout:Math.random()<cfg.germ,rot:c.rot});
}
function beginSapling(c){
  saplings.push({x:c.x,age:0,duration:rand(cfg.sapMin,cfg.sapMax),targetH:H*rand(.84,.96),depth:Math.random()});
  burst(c.x,groundY-5,7,C.sprout);
}
function matureSapling(s){
  trees.push(makeTree(s.x,s.targetH,s.depth));
  squirrels.push(makeSquirrel(trees.length-1));
  burst(s.x,groundY-s.targetH*.25,7,C.sprout);
  hud('New tree, new squirrel');
}

function basketGeometry(){
  const ch=chars[selected],cy=groundY-ch.h*.54,centerX=playerX+facing*20;
  return{cx:centerX,cy,w:26,h:12,handleH:11};
}
function basketBounds(){
  const b=basketGeometry();
  return{x1:b.cx-b.w*.52,x2:b.cx+b.w*.52,y1:b.cy-b.h*.55,y2:b.cy+b.h*.55};
}
function bodyHit(p){
  const ch=chars[selected];
  return p.x+p.r>playerX-ch.w*.38&&p.x-p.r<playerX+ch.w*.38&&p.y+p.r>groundY-ch.h&&p.y-p.r<groundY-4;
}

function catchCone(i){
  const c=objects[i],b=basketGeometry();
  objects.splice(i,1);caught++;bonus+=cfg.catchPoints;
  catchAnims.push({type:c.type,x:c.x,y:c.y,startX:c.x,startY:c.y,targetX:b.cx,targetY:b.cy+2,age:0,duration:.22,rot:c.rot});
  hud('Caught +'+cfg.catchPoints);
}
function rescue(i){
  const h=objects[i];objects.splice(i,1);
  if(bonks>0){bonks--;hud('Hare rescued — bonk recovered')}
  else{bonus+=cfg.harePoints;hud('Hare rescued +'+cfg.harePoints)}
  burst(h.x,h.y,9,C.hare);
}
function bonk(i){
  if(invuln>0)return;
  objects.splice(i,1);bonks++;invuln=cfg.immunity;
  burst(playerX,groundY-35,10,'#d59d72');
  hud('BONK '+bonks+'/'+cfg.maxBonks);
  if(bonks>=cfg.maxBonks)end();
}

function launchHawk(){
  const minS=cfg.protectLast?2:1;
  if(hawk.active||squirrels.length<minS)return;
  const target=squirrels[Math.floor(Math.random()*squirrels.length)],p=sPos(target),dir=Math.random()<.5?1:-1;
  hawk={active:true,t:0,duration:1.55,target,carrying:null,grabbed:false,
        startX:dir>0?-60:W+60,startY:clamp(p.y-90,18,H*.28),grabX:p.x,grabY:p.y,
        endX:dir>0?W+90:-90,endY:Math.max(12,p.y-125),dir};
  statusEl.textContent='Hawk!';
}
function updateHawk(dt){
  if(!hawk.active)return;
  hawk.t+=dt;const u=clamp(hawk.t/hawk.duration,0,1);
  if(!hawk.grabbed&&u>=.52){
    const idx=squirrels.indexOf(hawk.target),canTake=!cfg.protectLast||squirrels.length>1;
    if(idx>=0&&canTake){hawk.carrying=squirrels[idx];squirrels.splice(idx,1);statusEl.textContent='The hawk took a squirrel'}
    hawk.grabbed=true;
  }
  if(u>=1){hawk.active=false;hawk.target=null;hawk.carrying=null}
}
function checkHawk(){
  while(elapsed>=nextHawkCheck){
    if(!hawk.active&&Math.random()<cfg.hawkProb)launchHawk();
    nextHawkCheck+=cfg.hawkInterval;
  }
}

function update(dt){
  elapsed+=dt;invuln=Math.max(0,invuln-dt);checkHawk();updateHawk(dt);

  const speed=Math.max(270,W*.52);
  if(moveDir){targetX+=moveDir*speed*dt;facing=moveDir}
  targetX=clamp(targetX,16,W-16);
  playerX+=(targetX-playerX)*Math.min(1,dt*17);

  squirrels.slice().forEach(s=>updateSquirrel(s,dt));
  const b=basketBounds();

  for(let i=objects.length-1;i>=0;i--){
    const p=objects[i];
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.spin*dt;
    const inBasket=p.vy>0&&p.x+p.r>b.x1&&p.x-p.r<b.x2&&p.y+p.r>b.y1&&p.y-p.r<b.y2;

    if(p.kind==='hare'){
      if(inBasket||bodyHit(p)){rescue(i);continue}
      if(p.y+p.r>=groundY){
        objects.splice(i,1);
        hares.push({x:clamp(p.x,12,W-12),age:0,dir:Math.random()<.5?-1:1});
        continue;
      }
    }else{
      if(inBasket){catchCone(i);continue}
      if(invuln<=0&&bodyHit(p)){bonk(i);if(state!=='playing')return;continue}
      if(p.y+p.r>=groundY){
        objects.splice(i,1);
        if(p.type==='brown')plantCone(p);else burst(p.x,groundY-3,4,C.soil);
      }
    }
  }

  for(let i=catchAnims.length-1;i>=0;i--){
    const a=catchAnims[i];
    a.age+=dt;
    const t=clamp(a.age/a.duration,0,1),e=smooth(t);
    a.x=lerp(a.startX,a.targetX,e);
    a.y=lerp(a.startY,a.targetY,e)-Math.sin(t*Math.PI)*5;
    a.rot+=dt*7;
    if(t>=1){burst(a.targetX,a.targetY,7,a.type==='green'?C.green2:C.spark);catchAnims.splice(i,1)}
  }

  for(let i=caches.length-1;i>=0;i--){
    const c=caches[i];c.age+=dt;
    if(c.age>=c.resolveAt){if(c.willSprout)beginSapling(c);caches.splice(i,1)}
  }

  for(let i=saplings.length-1;i>=0;i--){
    const s=saplings[i];s.age+=dt;
    if(s.age>=s.duration){matureSapling(s);saplings.splice(i,1)}
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=95*dt;
    if(p.age>=p.life)particles.splice(i,1);
  }

  for(let i=hares.length-1;i>=0;i--){
    const h=hares[i];h.age+=dt;h.x+=h.dir*52*dt;
    if(h.age>1.4)hares.splice(i,1);
  }
  hud();
}

function rr(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}
}

function background(){
  const g=ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,C.sky1);g.addColorStop(1,C.sky2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.fillStyle=C.mountain;ctx.beginPath();
  ctx.moveTo(0,H*.36);ctx.quadraticCurveTo(W*.18,H*.24,W*.35,H*.39);
  ctx.quadraticCurveTo(W*.53,H*.22,W*.7,H*.38);
  ctx.quadraticCurveTo(W*.86,H*.25,W,H*.36);
  ctx.lineTo(W,groundY);ctx.lineTo(0,groundY);ctx.fill();

  ctx.fillStyle=C.far;ctx.beginPath();
  ctx.moveTo(0,H*.57);ctx.quadraticCurveTo(W*.22,H*.41,W*.42,H*.58);
  ctx.quadraticCurveTo(W*.66,H*.39,W,H*.55);
  ctx.lineTo(W,groundY);ctx.lineTo(0,groundY);ctx.fill();

  ctx.fillStyle=C.near;ctx.beginPath();
  ctx.moveTo(0,H*.72);ctx.quadraticCurveTo(W*.25,H*.56,W*.48,H*.72);
  ctx.quadraticCurveTo(W*.72,H*.52,W,H*.68);
  ctx.lineTo(W,groundY);ctx.lineTo(0,groundY);ctx.fill();

  ctx.fillStyle=C.ground;ctx.fillRect(0,groundY,W,H-groundY);
  ctx.fillStyle=C.soil;ctx.fillRect(0,groundY+7,W,H-groundY-7);
}

function depthColors(depth){
  const far=1-depth;
  return{
    pine:far>.55?'#3e6251':C.pine,
    pine2:far>.55?'#52715d':C.pine2,
    bark:far>.55?'#765a44':C.bark,
    stroke:far>.55?'rgba(43,59,50,.40)':'rgba(24,39,32,.72)',
    lw:lerp(.45,1.25,depth),alpha:lerp(.82,1,depth)
  };
}

function drawConifer(x,baseY,h,depth,tiers=9){
  const d=depthColors(depth);ctx.save();ctx.globalAlpha=d.alpha;
  rr(x-4.5,baseY-h+27,9,h-25,3,d.bark,null);
  for(let i=0;i<tiers;i++){
    const yy=baseY-h+8+i*(h*.082),half=18+i*6.6;
    ctx.fillStyle=i%2?d.pine:d.pine2;
    ctx.beginPath();ctx.moveTo(x,yy-22);ctx.lineTo(x-half,yy+32);ctx.lineTo(x+half,yy+32);ctx.closePath();
    ctx.fill();ctx.strokeStyle=d.stroke;ctx.lineWidth=d.lw;ctx.stroke();
  }
  ctx.restore();
}

function drawTree(t,now){
  const sway=reduced?0:Math.sin(now*.001+t.sway)*1.15;
  drawConifer(t.x+sway,groundY,t.h,t.depth,9);
}

function drawCache(c){
  const settle=clamp(c.age/c.settle,0,1),e=smooth(settle),sink=lerp(-8,-2,e);
  ctx.save();ctx.translate(c.x,groundY+sink);ctx.rotate(lerp(c.rot,.15,e));
  ctx.fillStyle=C.brown;ctx.strokeStyle='#4f3929';ctx.lineWidth=.55;
  ctx.beginPath();ctx.ellipse(0,0,5,8,0,0,6.28);ctx.fill();ctx.stroke();ctx.restore();
  ctx.fillStyle='rgba(75,54,37,.75)';ctx.beginPath();ctx.ellipse(c.x,groundY+1,8,2.6,0,0,6.28);ctx.fill();
}

function drawSapling(s){
  const p=clamp(s.age/s.duration,0,1),e=smooth(p),h=lerp(9,s.targetH,e);
  if(p<.28){
    ctx.strokeStyle=C.bark;ctx.lineWidth=2.3;ctx.beginPath();
    ctx.moveTo(s.x,groundY);ctx.lineTo(s.x,groundY-h);ctx.stroke();
    ctx.fillStyle=C.sprout;
    for(let i=0;i<3;i++){
      const yy=groundY-h+i*h*.24,w=4+e*11+i*2;
      ctx.beginPath();ctx.moveTo(s.x,yy-3);ctx.lineTo(s.x-w,yy+9);ctx.lineTo(s.x+w,yy+9);ctx.closePath();ctx.fill();
    }
  }else{
    const q=(p-.28)/.72,tiers=Math.max(3,Math.round(3+q*6));
    drawConifer(s.x,groundY,h,s.depth,tiers);
  }
}

function drawSquirrelAt(p,s,scale=.56){
  ctx.save();ctx.translate(p.x,p.y);ctx.scale((s.side||1)*scale,scale);
  ctx.fillStyle=s.color.body;ctx.strokeStyle=s.color.dark;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.ellipse(-10,-1,8,17,-.65,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(0,3,7,11,.08,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(6,-6,5.5,0,6.28);ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawSquirrel(s){drawSquirrelAt(sPos(s),s,.56)}

function drawConeSprite(x,y,type,rot,scale=1){
  const body=type==='green'?C.green:C.brown,detail=type==='green'?C.green2:C.brown2;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(scale,scale);
  ctx.fillStyle=body;ctx.strokeStyle='#4f3929';ctx.lineWidth=.55;
  ctx.beginPath();ctx.ellipse(0,0,5,8,0,0,6.28);ctx.fill();ctx.stroke();
  ctx.strokeStyle=detail;ctx.lineWidth=.5;
  for(let yy=-4;yy<=3.5;yy+=3){ctx.beginPath();ctx.moveTo(-3,yy);ctx.lineTo(3,yy+1.2);ctx.stroke()}
  ctx.restore();
}
function drawCone(c){drawConeSprite(c.x,c.y,c.type,c.rot,1)}
function drawCatchAnim(a){
  const t=clamp(a.age/a.duration,0,1);
  drawConeSprite(a.x,a.y,a.type,a.rot,lerp(1,.45,smooth(t)));
}

function drawHare(h){
  ctx.save();ctx.translate(h.x,h.y);ctx.fillStyle=C.hare;ctx.strokeStyle=C.hareDark;ctx.lineWidth=.8;
  ctx.beginPath();ctx.ellipse(0,2,5.5,6,0,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(3,-3,4,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(1,-9,1.5,5,-.15,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(5,-9,1.5,5,.15,0,6.28);ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawRunHare(h){
  ctx.save();ctx.translate(h.x,groundY-5-Math.abs(Math.sin(h.age*12))*4);ctx.scale(h.dir,1);
  ctx.fillStyle=C.hare;ctx.strokeStyle=C.hareDark;ctx.lineWidth=.8;
  for(const [x,tilt] of [[2,-.18],[5,.12]]){
    ctx.beginPath();ctx.ellipse(x,-8,1.3,4.4,tilt,0,6.28);ctx.fill();ctx.stroke();
  }
  ctx.fillStyle=C.hare;ctx.beginPath();ctx.ellipse(0,0,5,4,0,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(4,-3,3,0,6.28);ctx.fill();ctx.restore();
}

function hawkPos(){
  if(!hawk.active)return null;
  const u=clamp(hawk.t/hawk.duration,0,1);let x,y;
  if(u<.52){
    const q=u/.52;x=lerp(hawk.startX,hawk.grabX,q);y=lerp(hawk.startY,hawk.grabY,q)-Math.sin(q*Math.PI)*16;
  }else{
    const q=(u-.52)/.48;x=lerp(hawk.grabX,hawk.endX,q);y=lerp(hawk.grabY,hawk.endY,q)-Math.sin(q*Math.PI)*12;
  }
  return{x,y,u};
}

function drawHawk(now){
  const p=hawkPos();if(!p)return;
  const flap=reduced?0:Math.sin(now*.028)*5;
  ctx.save();ctx.translate(p.x,p.y);ctx.scale(hawk.dir,1);
  ctx.fillStyle=C.hawk;ctx.strokeStyle=C.hawkDark;ctx.lineWidth=1.2;
  ctx.beginPath();ctx.ellipse(0,0,15,6,0,0,6.28);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(-2,0);ctx.quadraticCurveTo(-18,-15-flap,-30,-7);ctx.quadraticCurveTo(-18,1,-4,4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(4,0);ctx.quadraticCurveTo(19,-14-flap,31,-5);ctx.quadraticCurveTo(18,2,5,4);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=C.hawkLight;ctx.beginPath();ctx.arc(12,-2,5,0,6.28);ctx.fill();ctx.stroke();ctx.restore();
  if(hawk.carrying&&p.u>=.52)drawSquirrelAt({x:p.x,y:p.y+15},hawk.carrying,.46);
}

function drawBasket(){
  const b=basketGeometry();ctx.save();ctx.translate(b.cx,b.cy);
  ctx.strokeStyle=C.basketDark;ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(0,-1,b.w*.40,Math.PI*1.08,Math.PI*1.92);ctx.stroke();

  ctx.fillStyle=C.basket;ctx.strokeStyle=C.basketDark;ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(-b.w*.5,-2);
  ctx.quadraticCurveTo(-b.w*.46,b.h*.56,0,b.h*.62);
  ctx.quadraticCurveTo(b.w*.46,b.h*.56,b.w*.5,-2);
  ctx.quadraticCurveTo(0,b.h*.08,-b.w*.5,-2);
  ctx.closePath();ctx.fill();ctx.stroke();

  ctx.strokeStyle=C.basketLight;ctx.lineWidth=.7;
  for(let x=-8;x<=8;x+=4){ctx.beginPath();ctx.moveTo(x,-1);ctx.lineTo(x*.75,b.h*.45);ctx.stroke()}
  ctx.beginPath();ctx.moveTo(-10,3);ctx.quadraticCurveTo(0,6,10,3);ctx.stroke();
  ctx.restore();
}

function drawPlayer(now){
  if(invuln>0&&Math.floor(invuln*12)%2===0)return;
  const ch=chars[selected],h=ch.h,w=ch.w,bob=reduced?0:Math.sin(now*.007)*.35;

  ctx.save();ctx.translate(playerX,groundY+bob);ctx.scale(facing,1);
  ctx.strokeStyle='#37281f';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-w*.18,-8);ctx.lineTo(-w*.28,0);ctx.moveTo(w*.18,-8);ctx.lineTo(w*.32,0);ctx.stroke();

  ctx.fillStyle=ch.coat;ctx.strokeStyle='#493626';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-w*.48,-h*.64);ctx.lineTo(w*.38,-h*.64);ctx.lineTo(w*.52,-10);ctx.lineTo(-w*.5,-10);ctx.closePath();ctx.fill();ctx.stroke();

  const headY=-h*.79,headR=Math.max(5.2,w*.36);
  ctx.fillStyle=ch.skin;ctx.beginPath();ctx.arc(1,headY,headR,0,6.28);ctx.fill();

  if(ch.hairLong){
    ctx.fillStyle=ch.hair;ctx.beginPath();ctx.ellipse(-2,headY+2,headR*.95,headR*1.55,.04,1.3,5);ctx.fill();
  }

  ctx.fillStyle=ch.hair;ctx.beginPath();ctx.arc(0,headY-headR*.45,headR*.95,Math.PI,6.28);ctx.fill();

  if(ch.beardOn){
    ctx.fillStyle=ch.beard;ctx.beginPath();ctx.arc(1,headY+headR*.38,headR*.78,0,Math.PI);ctx.fill();
  }

  if(ch.capOn){
    ctx.fillStyle=ch.cap;ctx.beginPath();ctx.arc(-1,headY-headR*.45,headR*1.02,Math.PI,6.28);ctx.fill();
    ctx.fillRect(-headR*1.5,headY-headR*.72,headR*.65,2.4);
  }

  ctx.strokeStyle='#493327';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(w*.34,-h*.48);ctx.lineTo(w*.70,-h*.45);ctx.stroke();
  ctx.restore();

  drawBasket();
}

function overlay(title,sub){
  ctx.fillStyle='rgba(22,25,20,.38)';ctx.fillRect(0,0,W,H);
  rr(W/2-145,H/2-49,290,98,14,'rgba(38,46,37,.91)','rgba(255,255,255,.15)',1);
  ctx.textAlign='center';ctx.fillStyle='#f3ead7';ctx.font='700 22px system-ui';
  ctx.fillText(title,W/2,H/2-8);
  ctx.fillStyle='#d8d2c1';ctx.font='14px system-ui';
  ctx.fillText(sub,W/2,H/2+18);
}

function draw(now=0){
  ctx.clearRect(0,0,W,H);background();

  const layers=[
    ...trees.map(t=>({kind:'tree',depth:t.depth,obj:t})),
    ...saplings.map(s=>({kind:'sap',depth:s.depth,obj:s}))
  ].sort((a,b)=>a.depth-b.depth);

  for(const l of layers)l.kind==='tree'?drawTree(l.obj,now):drawSapling(l.obj);

  caches.forEach(drawCache);
  squirrels.forEach(drawSquirrel);
  objects.forEach(o=>o.kind==='hare'?drawHare(o):drawCone(o));
  hares.forEach(drawRunHare);
  drawPlayer(now);
  catchAnims.forEach(drawCatchAnim);
  drawHawk(now);

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,1-p.age/p.life);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(state==='ready')overlay('CONE CATCHER','Tune the settings, then start');
  if(state==='paused')overlay('PAUSED','Resume when ready');
  if(state==='over')overlay('RUN OVER','Score '+finalScore+' · '+caught+' cones');
}

function loop(now){
  if(state!=='playing')return;
  const dt=Math.min(.033,Math.max(0,(now-last)/1000));
  last=now;update(dt);draw(now);
  if(state==='playing')raf=requestAnimationFrame(loop);
}

function point(e){
  if(state!=='playing')return;
  const r=canvas.getBoundingClientRect(),nx=clamp((e.clientX-r.left)*(W/r.width),16,W-16);
  if(nx>playerX+3)facing=1;else if(nx<playerX-3)facing=-1;
  targetX=nx;
}

canvas.addEventListener('pointerdown',e=>{
  e.preventDefault();canvas.setPointerCapture?.(e.pointerId);point(e);
});
canvas.addEventListener('pointermove',e=>{
  if(e.buttons||e.pointerType==='touch')point(e);
});

function hold(btn,dir){
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault();moveDir=dir;facing=dir;btn.setPointerCapture?.(e.pointerId);
  });
  const stop=()=>{if(moveDir===dir)moveDir=0};
  btn.addEventListener('pointerup',stop);
  btn.addEventListener('pointercancel',stop);
  btn.addEventListener('lostpointercapture',stop);
}
hold(leftBtn,-1);hold(rightBtn,1);

startBtn.addEventListener('click',start);
restartBtn.addEventListener('click',start);
pauseBtn.addEventListener('click',pause);

readSettings();
let resizeQueued=false;
function queueResize(){
  if(resizeQueued)return;
  resizeQueued=true;
  requestAnimationFrame(()=>{
    resizeQueued=false;
    resize();
  });
}
window.addEventListener('resize',queueResize,{passive:true});
window.addEventListener('orientationchange',queueResize,{passive:true});
resize();
hud('Ready');
})();
</script>
</body>
</html>
